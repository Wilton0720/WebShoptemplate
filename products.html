<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - TechShop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <h1><i class="fas fa-laptop"></i> TechShop</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html" class="cart-link">
                <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)
            </a>
        </nav>
    </header>

    <main>
        <section class="products-page">
            <h2>Our Products</h2>
            
            <div class="filters">
                <h3>Filter by Category:</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">All Products</button>
                    <button class="filter-btn" data-category="smartphones">Smartphones</button>
                    <button class="filter-btn" data-category="laptops">Laptops</button>
                    <button class="filter-btn" data-category="accessories">Accessories</button>
                    <button class="filter-btn" data-category="audio">Audio</button>
                </div>
            </div>

            <div class="products-grid" id="products-container">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>TechShop</h3>
                <p>Your trusted source for premium electronics</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="cart.html">Shopping Cart</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: info@techshop.com</p>
                <p>Phone: (555) 123-4567</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 TechShop. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Load all products and setup filtering
        document.addEventListener('DOMContentLoaded', function() {
            const productsContainer = document.getElementById('products-container');
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            // Display all products initially
            displayProducts(products);
            updateCartCount();
            
            // Setup filter functionality
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Update active filter button
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Filter products
                    const category = this.dataset.category;
                    if (category === 'all') {
                        displayProducts(products);
                    } else {
                        const filteredProducts = products.filter(product => product.category === category);
                        displayProducts(filteredProducts);
                    }
                });
            });
            
            function displayProducts(productsToShow) {
                productsContainer.innerHTML = '';
                productsToShow.forEach(product => {
                    productsContainer.appendChild(createProductCard(product));
                });
            }
        });
    </script>
</body>
</html>
